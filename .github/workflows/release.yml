name: Release

# Publishes each new version in package.json as a GitHub release: a vX.Y.Z
# tag, the package file (kingdom-X.Y.Z.tgz) and the plugin bundle
# (kingdom-X.Y.Z.zip). Then it uploads the bundle to dingn, like a game: it
# waits on dingn's admin Rewards page until an admin approves it, which makes
# it live with no rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - if: steps.version.outputs.released != 'true'
        run: npm run verify
      - name: Build the plugin bundle
        run: npm run build:plugin -- --zip
      - name: Publish the release
        if: steps.version.outputs.released != 'true'
        run: |
          npm pack
          gh release create "v${{ steps.version.outputs.version }}" \
            "kingdom-${{ steps.version.outputs.version }}.tgz" \
            "dist/kingdom-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "kingdom ${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Every run uploads the current version, even one released earlier, so
      # an upload that failed (or ran before the secret was set) is retried by
      # running this workflow again. dingn ignores a version it already has.
      - name: Upload the bundle to dingn for review
        env:
          # An upload key of a dingn admin who is also a developer (made on
          # dingn's API keys page, /developers/keys/).
          DINGN_UPLOAD_KEY: ${{ secrets.DINGN_UPLOAD_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$DINGN_UPLOAD_KEY" ]; then
            echo "::warning::No DINGN_UPLOAD_KEY secret: v$VERSION was not uploaded to dingn."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $DINGN_UPLOAD_KEY" \
            -H "Content-Type: application/zip" \
            --data-binary "@dist/kingdom-$VERSION.zip" \
            https://dingn.com/api/rewards/upload
          echo "Uploaded v$VERSION to dingn for review: https://dingn.com/admin/rewards/" >> "$GITHUB_STEP_SUMMARY"
